name: Deploy Lenslight to Google Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}

jobs:
  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker --quiet

      - name: Build and push backend image
        run: |
          docker build -t gcr.io/${PROJECT_ID}/lenslight-backend:${{ github.sha }} ./backend
          docker push gcr.io/${PROJECT_ID}/lenslight-backend:${{ github.sha }}

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy lenslight-backend \
            --image gcr.io/${PROJECT_ID}/lenslight-backend:${{ github.sha }} \
            --platform managed \
            --region ${REGION} \
            --allow-unauthenticated \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }} \
            --set-env-vars "MONGO_URL=${{ secrets.MONGO_URL }},DB_NAME=${{ secrets.DB_NAME }},JWT_SECRET=${{ secrets.JWT_SECRET }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},GOOGLE_API_KEY=${{ secrets.GEMINI_API_KEY }},GEMINI_MODEL=${{ secrets.GEMINI_MODEL }},WEBHOOK_CRON_SECRET=${{ secrets.WEBHOOK_CRON_SECRET }},FRONTEND_URL=${{ secrets.FRONTEND_URL }},DEMO_EMAIL=${{ secrets.DEMO_EMAIL }},DEMO_PASSWORD=${{ secrets.DEMO_PASSWORD }},EMAIL_API_KEY=${{ secrets.EMAIL_API_KEY }},GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},BQ_DATASET=${{ secrets.BQ_DATASET }},BQ_TABLE=${{ secrets.BQ_TABLE }}"

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker --quiet

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg REACT_APP_BACKEND_URL=${{ secrets.FRONTEND_PUBLIC_BACKEND_URL }} \
            -t gcr.io/${PROJECT_ID}/lenslight-frontend:${{ github.sha }} \
            ./frontend
          docker push gcr.io/${PROJECT_ID}/lenslight-frontend:${{ github.sha }}

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy lenslight-frontend \
            --image gcr.io/${PROJECT_ID}/lenslight-frontend:${{ github.sha }} \
            --platform managed \
            --region ${REGION} \
            --allow-unauthenticated \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
