crons:
  - name: weekly-digest
    description: "Emails every opted-in user a Monday morning digest of last week's checkout, cart, and revenue anomalies"
    # Monday 09:00 UTC (0=Sunday, 1=Monday)
    cron: "0 9 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
